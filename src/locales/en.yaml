  next_step_notice: "👉 Next Step: Switch to 'Zone Settings' tab and execute Terraform to deploy DNS/WAF/SSL!"
  manual_hardening_expander: "🛡️ Free Tier Optimization: Manual Post-Provisioning Hardening Checklist"
  manual_hardening_content: |
    > 💡 **Why this requires manual Web UI activation:**
    > Cloudflare restricts programmatic API access to Bot Management and Page Shield on Free plans (`403 Feature not available via API`).
    > However, Cloudflare **allows activating these enterprise-grade features for free directly in the Web Dashboard**!
    
    Complete these 4 quick steps in the Cloudflare dashboard once after domain registration:
    
    1. **Heuristic Bot Defense & AI Crawler Tarpits (`Security ➔ Settings`):**
       * Scroll to the bottom and enable: **Bot Fight Mode = `ON`** (mitigates automated Layer 7 botnets).
       * Enable: **AI Labyrinth = `ON`** (deploys honeypot links trapping automated scrapers in an infinite loop).
    
    2. **Client-Side Supply Chain Security (`Security ➔ Settings`):**
       * Locate the Page Shield Lite block and enable: **Continuous script monitoring = `ON`** (monitors JS assets for unauthorized Magecart or e-skimming tampering).
    
    3. **AI Scraping Governance (`AI Crawl Control ➔ Security`):**
       * **Search Engines (Google, Yandex, Bing):** keep **`Allow`** (preserves organic indexing).
       * **AI Model Training:** switch to **`Block`** (prohibits content scraping from GPTBot, CCBot, etc.).
       * **Block training in robots.txt:** toggle to **`ON`**.
    
    4. **Reverse Proxy Real-IP Restoration (Joomla CMS):**
       * In the Joomla admin panel navigate to: *System ➔ Global Configuration ➔ Server* and set: **Behind Load Balancer = `Yes`** (restores actual visitor IPs from `CF-Connecting-IP`).

