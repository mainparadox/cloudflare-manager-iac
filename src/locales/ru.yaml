  next_step_notice: "👉 Следующий шаг: Перейдите на вкладку 'Настройки Зоны' и нажмите кнопку запуска Terraform!"
  manual_hardening_expander: "🛡️ Важно для Free-тарифа: Чек-лист ручного «дожима» безопасности"
  manual_hardening_content: |
    > 💡 **Почему это делается вручную через браузер:**
    > Cloudflare блокирует программное включение защиты от ботов и мониторинга скриптов через API на бесплатном тарифе (`403 Feature not available via API`). 
    > Однако эти **enterprise-функции можно бесплатно включить кликом мышки в веб-панели**!
    
    Сделайте эти 4 простых шага в панели Cloudflare один раз сразу после регистрации домена:
    
    1. **Защита от ботов и ловушка для ИИ (`Security ➔ Settings`):**
       * Прокрутите страницу вниз и включите: **Bot Fight Mode = `ON`** (блокировка ботнетов).
       * Включите: **AI Labyrinth = `ON`** (создание скрытых ссылок-ловушек, в которых бесконечно зацикливаются ИИ-парсеры).
    
    2. **Мониторинг внедрения вирусов в скрипты (`Security ➔ Settings`):**
       * Найдите блок Page Shield Lite и включите: **Continuous script monitoring = `ON`** (постоянный аудит JS-библиотек сайта для защиты от вирусов Magecart и перехвата платежных форм).
    
    3. **Защита контента от нейросетей (`AI Crawl Control ➔ Security`):**
       * **Search Engines (Поисковики):** оставьте **`Allow`** (чтобы Яндекс и Google продолжали индексировать сайт!).
       * **AI Model Training (Обучение ИИ):** переключите в **`Block`** (запрещает GPTBot, CCBot и другим воровать тексты).
       * **Block training in robots.txt:** включите тумблер (**`ON`**).
    
    4. **Настройка реальных IP в CMS (для Joomla):**
       * В админке Joomla перейдите в: *Система ➔ Общие настройки ➔ Сервер* и включите: **За прокси-сервером = `Да`** (чтобы в логах и заказах отображались настоящие IP посетителей, а не сервера Cloudflare).

